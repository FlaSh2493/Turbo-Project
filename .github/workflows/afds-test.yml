# afds 패키지 테스트 · 타입체크 · lint
#
# 이 워크플로는 **직접 pull_request 로 트리거되지 않는다.** ci.yml 이 workflow_call 로
# 호출한다. 이유는 두 가지다:
#
# 1. paths 필터를 가진 워크플로를 필수 체크(required status check)로 지정하면, 그 경로를
#    건드리지 않는 PR 에서 체크가 **보고되지 않아** GitHub 이 "expected but not reported"
#    로 영구히 기다린다. 즉 PR 이 막힌다.
# 2. 그래서 경로 관련성(relevance) 판정을 ci.yml 의 `changes` job 한 곳으로 모았다.
#    "돌아야 했는가" 와 "돌았는가" 가 같은 실행의 같은 데이터에서 나오므로 두 판정이
#    어긋날 수 없다. 판정 로직을 두 곳에 복제하면 그게 다음 결함이 된다.
#
# 단독 실행이 필요하면 Actions 탭에서 workflow_dispatch 로 돌린다.
name: AFDS Test & Type Check

on:
  workflow_call:
  workflow_dispatch:

env:
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  afds-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # verify-doc-citations.ts 의 "인용 내용 소실" 검사가 인용 줄의 git blame 커밋을
          # 기준으로 드리프트를 본다(§blameLines). 기본 fetch-depth: 1(shallow) 이면 체크아웃에
          # 커밋이 하나뿐이라 **모든 줄이 그 한 커밋으로 blame되고, 그러면 "blame 시점 내용"과
          # "현재 내용"이 같은 커밋에서 읽혀 항상 같아진다** — 실측: PR #143 에서
          # `knownContentLoss` 항목 3건이 로컬(전체 히스토리)에서는 정상 동작했는데 CI 에서
          # "죽은 예외"로 오탐됐다(depth-1 클론을 직접 재현해 확인). ci.yml·chromatic.yml·
          # changeset-check.yml 이 이미 같은 이유로 `fetch-depth: 0` 을 쓴다 — 같은 값을 쓴다.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Type check
        run: pnpm check-types

      # `pnpm --filter <pkg> <script>` 는 **스크립트가 없어도 exit 0** 이다(실측):
      # (아래 전사는 실제 실행 기록이며 패키지 이름만 현재 이름으로 바꿨다.)
      #   $ pnpm --filter @turbo-project/afds-registry lint
      #   None of the selected packages has a "lint" script
      #   exit=0
      # 그래서 스크립트가 사라지거나 이름이 바뀌면 이 스텝이 **아무것도 검사하지 않고
      # 초록**이 된다 — 이 저장소가 반복해 밟은 형태다. 존재를 먼저 단정한다.
      #
      # 단정을 인라인 `node -e` 로 적지 않고 헬퍼로 부르는 이유: 같은 결함이 이 저장소의
      # pnpm 호출 지점 여러 곳에 있어서, 인라인으로 적으면 그 수만큼 복제되고 하나가
      # 갱신되지 않으면 조용히 약해진다. 헬퍼는 한 곳이고 자기 테스트를 가진다
      # (.github/scripts/__tests__/pnpm-run.test.sh — 실제 임시 워크스페이스로 검증).
      #
      # 헬퍼는 인라인 판이 잡던 것을 전부 잡고, 하나를 더 잡는다: 필터 문자열을 손으로
      # 적지 않고 package.json 의 name 에서 읽으므로 **패키지 이름이 바뀌어도** 무동작
      # 초록이 되지 않는다. 인라인 판은 scripts.lint 만 봐서 이 경우를 통과시킨다.
      - name: Lint
        run: bash .github/scripts/pnpm-run.sh packages/afds lint

      # 기대 집합은 **워크스페이스에서 test:run 을 가진 패키지 전체**다 — 새 패키지가
      # test:run 을 가지면 여기서 실패한다(목록 미갱신). 개수로 쓰지 않는다: 3 이라는 숫자는
      # 하나가 빠지고 하나가 늘면 그대로 통과하기 때문이다.
      #
      # 실행은 afds 축 둘만 한다. `packages/afds-registry` 는 afds-registry-test.yml 이 돌린다 —
      # ci-detect-changes.sh 가 `packages/afds/*` 변경에 afds_registry 도 켜므로 afds 만 바꾼 PR
      # 에서도 빠지지 않는다. 여기서 또 돌리면 같은 vitest 가 두 러너에서 중복으로 돈다.
      # 목록의 모든 패키지가 어느 워크플로에선가 실행되는지는 ci-structure.test.sh 가 대조한다
      # — 목록에 더하고 실행 스텝을 빠뜨리면 조용히 안 도는 패키지가 생기기 때문이다.
      - name: Run tests
        run: |
          bash .github/scripts/assert-script-owners.sh test:run \
            packages/afds packages/afds-registry packages/figma-token-bridge
          bash .github/scripts/pnpm-run.sh packages/afds test:run
          bash .github/scripts/pnpm-run.sh packages/figma-token-bridge test:run

      # 문서 인용 진실성 — `docs/**`·`.claude/rules/**`·README 의 인용과 import 가
      # 실재하는 코드로 해소되는지 검사한다.
      #
      # 이 저장소는 이미 "가드가 존재하지만 아무도 부르지 않는" 상태를 한 번 겪었다
      # (이 검증기 자체가 그랬다). `pnpm --filter` 는 스크립트가 없어도 exit 0 이므로
      # 호출은 `pnpm-run.sh` 헬퍼를 거친다 — 존재 단정이 거기 한 곳에 있다.
      #
      # **Build 이후에 둔다.** 이 검사의 정본 export 표면은 `dist/*` 를 실제로 `import()`
      # 해서 얻는다 — 빌드 전에는 표면을 읽을 수 없다.
      #
      # **마지막에 둔다.** 실패가 빌드·타입·테스트 실패를 가리지 않게 한다.
      - name: Verify doc citations
        run: bash .github/scripts/pnpm-run.sh packages/afds verify:docs
