# Storybook을 GitHub Pages로 배포
name: Deploy Storybook to Pages

on:
  # main 브랜치에 push될 때 실행 (Storybook 관련 파일 변경 시에만)
  push:
    branches: ['main']
    paths:
      - 'apps/storybook/**'
      - 'packages/afds/**'
      - 'packages/afds-registry/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-storybook.yml'

  # Actions 탭에서 수동으로 실행 가능
  workflow_dispatch:

env:
  NODE_OPTIONS: '--max-old-space-size=4096'

# GitHub Pages 배포를 위한 GITHUB_TOKEN 권한 설정
permissions:
  contents: read
  pages: write
  id-token: write

# 동시 배포 방지 - 진행 중인 배포는 취소하지 않음
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  # 빌드 Job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # build-storybook 스크립트가 afds 빌드를 먼저 수행한다.
      - name: Build Storybook
        run: bash .github/scripts/pnpm-run.sh apps/storybook build-storybook

      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: 'apps/storybook/storybook-static'

  # 배포 Job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
