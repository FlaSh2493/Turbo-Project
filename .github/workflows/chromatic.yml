# Chromatic으로 Storybook 배포
# - PR 오픈/업데이트: 변경분만 스냅샷하는 프리뷰 빌드
# - workflow_dispatch: 정식(릴리즈) 빌드. release.yml이 afds publish 직후 dispatch한다.
#   전체 스냅샷 + 현재 브랜치 자동 승인으로 published Storybook permalink를 최신 정식 버전으로 유지한다.
name: Chromatic

on:
  # PR이 열리거나 업데이트될 때 실행
  pull_request:
    # base(대상) 브랜치 필터다. 레포 실제 네이밍은 feat/ 이고 feature/ 브랜치는 0건이라
    # feat/* 를 base 로 쓰는 PR 이 CI 없이 머지되고 있었다 (feat/ ≠ feature/).
    branches: ['main', 'develop', 'feature/**', 'feat/**']
    types: [opened, synchronize, reopened]
    # paths 필터를 두지 않는다 — 이유가 둘 있다.
    #
    # 1. `UI Tests` 는 Chromatic 앱이 올리는 커밋 상태다. 이 워크플로가 안 돌면 그 상태가
    #    **보고되지 않으므로**, paths 필터가 있는 채로 `UI Tests` 를 필수 체크로 지정하면
    #    해당 경로를 건드리지 않는 PR 이 "expected but not reported" 로 영구히 막힌다.
    #    필터를 지우는 것이 나중에 `UI Tests` 를 필수로 올릴 수 있는 전제다.
    # 2. 비용이 거의 늘지 않는다. TurboSnap 이 무관한 PR 을 스냅샷 0장으로 끝낸다
    #    (실측: #97·#98 은 CSS 0건 변경 → "Bypassed 405 snapshots", 과금 스냅샷 0).
    #    남는 비용은 Storybook 빌드 러너 시간뿐이다(~1.5~2분/PR).
    #
    # 주의: 필터 제거만으로는 아무것도 막지 않는다. `exitZeroOnChanges: true` 때문에
    # 이 워크플로의 `chromatic` 체크는 시각 변경이 있어도 초록이다 — 실제 게이트는
    # `UI Tests` 하나뿐이고, 그것을 필수로 올리는 것은 별개 작업이다.

  # 정식 배포(릴리즈) 및 수동 실행
  workflow_dispatch:
    inputs:
      afds_tag:
        description: 'Storybook URL 을 붙일 afds 릴리즈 태그(예: @turbo-project/afds@1.0.0). 비우면 가장 최근 afds 릴리즈를 찾는다.'
        required: false
        default: ''

# 동시 실행 관리 - 같은 PR의 이전 실행은 취소
concurrency:
  group: chromatic-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: read

env:
  NODE_OPTIONS: '--max-old-space-size=4096'

jobs:
  chromatic:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          # TurboSnap 이 조상 빌드를 찾는 데 전체 히스토리가 필요하다.
          fetch-depth: 0
          # 이 워크플로에는 git 원격 접근이 없다 — Chromatic CLI 는 로컬 히스토리만 읽고
          # (fetch-depth: 0 이라 shallow 가 아니므로 deepen fetch 도 하지 않는다),
          # gh release 는 GH_TOKEN 을 쓴다. 그래서
          # 로컬 git config 에 토큰을 남길 이유가 없다.
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        # 헬퍼를 거친다 — `pnpm --filter` 는 스크립트가 없어도 exit 0 이다(실측).
        run: bash .github/scripts/pnpm-run.sh packages/afds build

      - name: Publish to Chromatic
        id: chromatic
        uses: chromaui/action@fd5e7e8b66d1a6862ed8866c21e93788217f7cf7 # v18.6.0
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          workingDir: apps/storybook
          buildScriptName: build-storybook
          exitZeroOnChanges: true
          # PR은 변경분만 스냅샷, 정식 배포는 전체 스냅샷
          onlyChanged: ${{ github.event_name == 'pull_request' }}
          # TurboSnap 은 preview-stats.json 의 모듈 그래프만 추적한다. 토큰 CSS 는
          # styles.css 의 **CSS @import** 로 들어오는데 Vite 가 transform 단계에서
          # 인라인하므로 rollup 모듈로 남지 않고, 그래프에 없는 변경 파일은 예외 없이
          # 조용히 버려진다. 그래서 토큰 CSS 변경이 시각 회귀 검사를 우회했다:
          #   run 33055507062 (#99) — 토큰 CSS 3건 변경 → "Bypassed 405 snapshots", 빌드 skip
          #   run 33056445119        — 토큰 CSS 3건 변경 → TurboSnap 켜진 채 22/405 만 촬영
          # (#97·#98 의 Bypass 는 CSS 를 한 줄도 안 바꿨으므로 이 버그가 아니라 정상 동작이다.)
          #
          # externals 에 걸리면 TurboSnap 을 끄고 전체 스냅샷으로 폴백한다.
          # (untraced 는 "무시하라"는 정반대 의미다 — 혼동하면 결과가 뒤집힌다.)
          #
          # 대상 경로 4개 — 아래 brace 글롭과 같다:
          #   packages/afds/tokens/**/*.css   Storybook 이 실제로 쓰는 토큰 CSS.
          #                                   main.cjs:45 이 @turbo-project/afds/styles 를
          #                                   tokens/index.css 로 alias 하고, 나머지
          #                                   tokens/*.css 는 그 파일의 @import 로 딸려 온다.
          #                                   fonts.css 는 Storybook 미사용이지만
          #                                   (preview-head.html 의 CDN link 를 쓴다) 글롭
          #                                   단순화를 위해 함께 잡힌다 — 오탐 1건 감수.
          #   packages/afds/src/**/*.css      dist CSS 의 git 추적 가능한 원본. 순수 방어용이다 —
          #                                   현재 이 경로의 CSS(src/styles/index.css)는
          #                                   Storybook 그래프에 도달하지 않는다(진입은
          #                                   preview.tsx:3 → styles.css 하나뿐).
          #   apps/storybook/**/*.css         styles.css — 위 alias 를 import 하는 진입 CSS.
          #   apps/storybook/.storybook/**    preview.tsx·main.cjs·preview-head.html 등
          #                                   Storybook 설정. 바뀌면 전 스토리 렌더가 달라진다.
          #
          # 경로는 **저장소 루트 기준**이다(workingDir=apps/storybook 기준이 아니다).
          # CLI 는 이 글롭을 git 변경파일 목록(로그의 "Found N changed files")에
          # picomatch(glob, {dot: true}) 로 매칭한다. 모듈 그래프도 빌드 산출물도 보지
          # 않으므로 CSS 주석 한 줄 변경으로도 폴백이 걸린다.
          #
          # tokens/** 로 넓히지 않은 이유: tokens/stories/*.stories.tsx 5개는 CSF 엔트리라
          # 이미 story 로 추적되고, tokens/README.md(10.6KB)·tokens/json/** 은 렌더에 영향이
          # 없다. 넓히면 문서 수정마다 405장 전체 빌드가 되는 비용 역행이 된다.
          #
          # .storybook/** 을 넣은 이유: CLI 는 configDir 트리 전체를 config 파일로 보고
          # 자체 폴백하는 것으로 **읽힌다**(turbosnapManifest 청크의 listTree(configDir),
          # getDependentStoryFiles 의 startsWith(configDir + '/')). 그러나 이 저장소에서
          # 그 경로만 단독으로 바뀐 런이 아직 없어 **실측되지 않았다.**
          # 검증되지 않은 CLI 내부 동작에 시각 회귀 검사를 걸지 않는다 — 글롭에 넣으면
          # 그 의존이 사라진다. 중복이면 무해하고, 아니면 구멍을 막는다.
          #
          # scripts/build.ts(→ dist JS, story 63/64 가 렌더하는 실물)는 **넣지 않았다.**
          # 그것까지 넣으면 afds src 변경 전반이 전체 빌드가 되어 onlyChanged 의 의미가
          # 사라진다 — dist vs src 추적은 별개 결정 사안이므로 #103 에서 다룬다.
          # 즉 이 설정은 CSS 축만 닫는다. JS 축은 여전히 열려 있다.
          #
          # PR 에서만 넘긴다. workflow_dispatch 는 onlyChanged 가 false 이고, 이때
          # externals 가 있으면 CLI 가 "--externals requires --only-changed" 로 죽는다.
          # (action 이 입력을 JSON.parse 하므로 "false" 가 boolean false 가 된다.)
          # 한 줄로 주면 brace 글롭 1개로 전달되고 CLI 가 picomatch 로 4분기를 확장한다.
          externals: ${{ github.event_name == 'pull_request' && '{packages/afds/tokens/**/*.css,packages/afds/src/**/*.css,apps/storybook/**/*.css,apps/storybook/.storybook/**,apps/storybook/vite.config.ts}' || '' }}
          # 정식 배포는 현재 브랜치 빌드를 자동 승인해 published permalink를 최신으로 유지
          autoAcceptChanges: ${{ github.event_name != 'pull_request' && github.ref_name || '' }}

      # Chromatic 이 빌드를 건너뛰면(TurboSnap 이 전체 스냅샷을 bypass 하는 등) CLI 결과에
      # URL 이 없다. 그런데 chromaui/action 은 모든 출력을 `String(value)` 로 넘기므로
      # 없는 값이 빈 문자열이 아니라 **문자열 "undefined"** 로 실린다(= truthy).
      # 따라서 falsy 검사로는 걸러지지 않는다 — 실제 http(s) URL 형태인지 검증해야 한다.
      # 값이 쓸 수 없으면 코멘트를 생략한다: 쓰레기 링크를 남기는 것보다 없는 편이 낫다.
      # (이때 Storybook Publish / UI Tests 체크가 여전히 URL 을 제공한다.)
      - name: Comment Storybook URL on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        env:
          # 템플릿 보간을 스크립트 본문에 직접 넣지 않고 env 로 전달한다(스크립트 주입 방지).
          STORYBOOK_URL: ${{ steps.chromatic.outputs.storybookUrl }}
          BUILD_URL: ${{ steps.chromatic.outputs.buildUrl }}
        with:
          script: |
            const asUrl = (v) => (/^https?:\/\/\S+$/.test(v ?? '') ? v : null);
            const storybookUrl = asUrl(process.env.STORYBOOK_URL);
            const buildUrl = asUrl(process.env.BUILD_URL);

            if (!storybookUrl && !buildUrl) {
              core.notice(
                'Chromatic 이 사용 가능한 URL 을 제공하지 않았습니다 ' +
                  `(storybookUrl=${JSON.stringify(process.env.STORYBOOK_URL ?? null)}, ` +
                  `buildUrl=${JSON.stringify(process.env.BUILD_URL ?? null)}). ` +
                  '빌드가 건너뛰어졌을 수 있습니다 — 코멘트를 생략합니다.'
              );
              return;
            }

            // 유효한 행만 남긴다. filter 를 표 전체에 걸면 구분용 빈 줄까지 지워지므로
            // 조건부 행에만 적용한다.
            const rows = [
              storybookUrl && `| 🔗 Storybook | [View Storybook](${storybookUrl}) |`,
              buildUrl && `| 🎨 Chromatic | [View Build](${buildUrl}) |`,
            ].filter(Boolean);

            const body = [
              '## 📚 Storybook Preview',
              '',
              '| Resource | Link |',
              '|----------|------|',
              ...rows,
              '',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' && comment.body.includes('📚 Storybook Preview')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

      # 정식 배포(main) 시 가장 최근 @turbo-project/afds 릴리즈 노트에 Storybook URL을 append
      - name: Append Storybook URL to latest afds release
        if: github.event_name != 'pull_request' && github.ref_name == 'main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STORYBOOK_URL: ${{ steps.chromatic.outputs.storybookUrl }}
          # release.yml 이 방금 배포한 태그를 넘겨준다. 이것이 없으면 아래 조회가
          # **실행 시점의 최신** afds 릴리즈를 집는데, 릴리스가 연달아 나오면 이번 빌드의
          # URL 이 다음 릴리즈에 붙는다. 수동 실행에서는 비어 있어 조회로 넘어간다.
          AFDS_TAG: ${{ inputs.afds_tag }}
        run: |
          tag="${AFDS_TAG:-}"
          if [ -n "$tag" ]; then
            echo "dispatch 가 지정한 태그를 쓴다: $tag"
          else
            tag=$(gh release list --limit 30 --json tagName \
              --jq '[.[] | select(.tagName | startswith("@turbo-project/afds@"))][0].tagName')
            echo "dispatch 입력이 없다 — 가장 최근 afds 릴리즈를 찾았다: ${tag:-(없음)}"
          fi
          if [ -z "$tag" ]; then
            echo "No @turbo-project/afds release found. Skipping note update."
            exit 0
          fi
          if ! gh release view "$tag" >/dev/null 2>&1; then
            echo "릴리즈 $tag 가 없다 — 노트 갱신을 건너뛴다."
            exit 0
          fi
          marker="<!-- storybook-url -->"
          current=$(gh release view "$tag" --json body --jq .body)
          appended=$(printf '%s\n\n%s\n📚 Storybook: %s\n' "${current%$marker*}" "$marker" "$STORYBOOK_URL")
          gh release edit "$tag" --notes "$appended"
